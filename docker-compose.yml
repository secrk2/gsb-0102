services:
  mysql:
    image: mysql:8.0
    container_name: huitang-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: huitang
      MYSQL_USER: huitang
      MYSQL_PASSWORD: huitang
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-phuitang"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: huitang-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: huitang-backend
    environment:
      DATABASE_URL: mysql+pymysql://huitang:huitang@mysql:3306/huitang?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      SEED_ON_START: "true"
      SCHEDULE_CACHE_TTL: "60"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    container_name: huitang-web
    ports:
      - "8102:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
